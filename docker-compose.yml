services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # Chemins dans le conteneur — indépendants des chemins hôte du .env.
      # Les volumes ci-dessous mappent les chemins hôte (depuis .env) vers ces chemins fixes.
      BEAMMP_RESOURCES_PATH: /beammp/resources
      BEAMMP_LOG_PATH: /beammp/logs/Server.log
      BEAMMP_CONFIG_PATH: /beammp/ServerConfig.toml
      DATA_DIR: /app/data
      IMAGES_PATH: /app/images
      # Statut en direct par le port de jeu (paquet I) : le serveur BeamMP
      # tourne sur l'hôte, joignable depuis le conteneur par ce nom.
      BEAMMP_INFO_HOST: ${BEAMMP_INFO_HOST:-host.docker.internal}
      # Fuseau de l'hôte : BeamMP écrit Server.log en heure locale, le panel
      # doit lire les mêmes heures (uptime, horodatages).
      TZ: ${TZ:-Europe/Paris}
      # Mise à jour depuis le panel (installation par install.sh) : le panel
      # dépose une demande ici, l'hôte fait la mise à jour.
      BEAMMP_PANEL_UPDATE_DIR: /app/update
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Base SQLite (remplace PostgreSQL depuis la v3).
      - app_data:/app/data
      - app_images:/app/images
      - ${BEAMMP_RESOURCES_PATH}:/beammp/resources
      # Le DOSSIER contenant Server.log, pas le fichier directement : BeamMP-Server
      # recrée ce fichier (renommé en Server.old.log) à chaque redémarrage plutôt
      # que de le tronquer sur place. Un bind mount sur un fichier unique reste
      # accroché à l'ancien inode : plus aucune écriture ne serait vue après un
      # redémarrage du serveur.
      - ${BEAMMP_LOG_DIR}:/beammp/logs:ro
      - ${BEAMMP_CONFIG_PATH}:/beammp/ServerConfig.toml
      # Sauvegardes de la v2, lues une seule fois par l'import (scripts/upgrade-to-v3.sh).
      - ./backups:/app/backups:ro
      - ./update:/app/update
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/info', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 128M

  # PostgreSQL de la v2 : plus utilisé par le panel. Gardé (profil « legacy »,
  # jamais démarré par défaut) seulement pour pouvoir refaire un pg_dump ou
  # revenir en arrière ; son volume postgres_data n'est jamais supprimé.
  postgres:
    image: postgres:16-alpine
    profiles: ["legacy"]
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-beammp}
      POSTGRES_USER:     ${POSTGRES_USER:-beammp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beammp}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  app_data:
  app_images:
  postgres_data:
